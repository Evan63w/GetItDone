name: Deploy GetItDone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  beta:
    name: Deploy beta to us-west-2
    runs-on: ubuntu-latest
    environment: beta
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      AWS_REGION: us-west-2
      CDK_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug OIDC claims
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
      
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
      
          echo "$ID_TOKEN" |
            awk -F. '{print $2}' |
            base64 -d 2>/dev/null |
            jq .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::341853291300:role/GetItDoneGitHubActionsDeployRoleBeta
          aws-region: us-west-2

      - name: Deploy beta stacks
        run: |
          npx cdk deploy --require-approval never \
            --context environment=beta \
            --context account=341853291300 \
            --context region=us-west-2 \
            GetItDoneCognitoStackBeta \
            GetItDoneDataStackBeta \
            GetItDoneTaskApiStackBeta

      - name: Collect beta deployment outputs
        run: |
          echo "USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name GetItDoneCognitoStackBeta --query 'Stacks[0].Outputs[?OutputKey==\`UserPoolId\`].OutputValue' --output text)" >> "$GITHUB_ENV"
          echo "APP_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name GetItDoneCognitoStackBeta --query 'Stacks[0].Outputs[?OutputKey==\`UserPoolClientId\`].OutputValue' --output text)" >> "$GITHUB_ENV"
          echo "API_URL=$(aws cloudformation describe-stacks --stack-name GetItDoneTaskApiStackBeta --query 'Stacks[0].Outputs[?OutputKey==\`ApiUrl\`].OutputValue' --output text)" >> "$GITHUB_ENV"
          echo "TASKS_TABLE_NAME=$(aws cloudformation describe-stacks --stack-name GetItDoneDataStackBeta --query 'Stacks[0].Outputs[?OutputKey==\`TasksTableName\`].OutputValue' --output text)" >> "$GITHUB_ENV"

      - name: Run beta integration test
        env:
          RUN_INTEGRATION_TESTS: "true"
          AWS_REGION: us-west-2
          GETITDONE_BETA_USER_POOL_ID: ${{ env.USER_POOL_ID }}
          GETITDONE_BETA_APP_CLIENT_ID: ${{ env.APP_CLIENT_ID }}
          GETITDONE_BETA_API_URL: ${{ env.API_URL }}
          GETITDONE_BETA_TASKS_TABLE_NAME: ${{ env.TASKS_TABLE_NAME }}
        run: npm test

  prod:
    name: Deploy prod to us-east-1
    needs: beta
    runs-on: ubuntu-latest
    environment: prod
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::341853291300:role/GetItDoneGitHubActionsDeployRoleProd
          aws-region: us-east-1

      - name: Deploy prod stacks
        run: |
          npx cdk deploy --require-approval never \
            --context environment=prod \
            --context account=341853291300 \
            --context region=us-east-1 \
            GetItDoneCognitoStackProd \
            GetItDoneDataStackProd \
            GetItDoneTaskApiStackProd
